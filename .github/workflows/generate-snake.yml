name: Refresh Nightfall Snake

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-snake.yml"

permissions:
  contents: write

concurrency:
  group: nightfall-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate Nightfall Snake with the official solver
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: duartess7
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: >-
            dist/nightfall-snake.svg?color_snake=#d8b4fe&color_dots=#0a0610,#21102f,#43205f,#7540a6,#b794f4

      - name: Publish refreshed animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/nightfall-snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh Nightfall Snake"
          git push
